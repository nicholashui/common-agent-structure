            "identity": "Clearly adult European man, late twenties. Handsome in a lived-in way: long-ish oval, high cheekbones that are not razor-cut, a straight nose with a small irregular bump on the bridge, a firm jaw that still has a little morning softness under it. Brow bone a bit heavy. Mouth slightly full for a man. Real proportions, a little asymmetrical — the left eye sits a hair lower. Short, uneven dark-blond stubble on the upper lip, jaw, and chin; not a styled beard, just overnight growth with mixed lengths and a few bare patches. A tiny pale scar cuts the left eyebrow. A flat brown mole sits on the right side of the neck just under the jaw, only visible if the frame drops.\nIf the frame drops, a faded black cotton tank and a thin silver chain.",
            "hair": "Hair is medium-brown with dull gold in the sun, slightly wavy, still damp at the roots as if he washed it an hour ago and let it air-dry on a roof. Medium length, falling forward off a rough side part. Damp pieces cling to the temple and the side of the neck. Dry ends lift in a thin rooftop wind at the temple and nape only. Hair never crosses the mouth or enters the lips. Every strand must read as real: mixed thickness, a few bent hairs, baby hairs at the hairline, salt-damp tips that catch the sun.",
            "skin": "Skin is the point. Do not generate poreless AI skin or a tanned Instagram-European face. On the cheeks, nostrils, and bridge you must clearly see: real pores, denser and slightly larger on the nose and inner cheek; fine texture and a slight orange-peel on the chin between stubble; a scatter of light freckles across the bridge and the upper cheeks, denser on the right; tiny pigment dots; one broken capillary near the inner right eye; mild wind-redness on the ears and around the nostrils; under-eye thin skin with a cool violet undertone, not a stamped dark circle; T-zone still a bit tight from the wash, with a small fresh oil point only on the nose tip; cheekbone highlight as real specular skin, with pore pits right beside it; fine blond vellus hair in front of the ear; stubble that casts tiny hard shadows when the sun rakes sideways; a faint pillow crease still dying out on the left cheek; fair-to-light adult male skin, a little weather on it, not spa-perfect.",
