[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "casops"
version = "0.1.0"
description = "CASOPS common-agent host (casops.common_agent.v3 / schema 3.0)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pydantic>=2.8",
    "cryptography>=43.0",
    "wasmtime>=27.0",
]

[project.scripts]
casops-eval = "casops.eval.harness:main"
casops-citation = "casops.citation.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]
api = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "cryptography>=43.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
packages = ["casops"]
strict = true
